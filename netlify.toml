[build]
  base = "."
  command = "pnpm --filter @tuturai/web build"
  publish = "apps/web/.next"
  functions = "apps/functions/netlify"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  # These values are public/runtime metadata, not credentials. Keep private
  # keys and provider tokens under Netlify's normal secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "AI_STT_ROUTE,AI_TTS_ROUTE,AI_LLM_ROUTE,AI_STT_MODEL_ID,AI_TTS_MODEL_ID,AI_LLM_MODEL_ID,GOOGLE_OAUTH_REDIRECT_URI,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID"

[context.production]
  command = "pnpm --filter @tuturai/web build"

[context.deploy-preview]
  command = "pnpm --filter @tuturai/web build"

[context.branch-deploy]
  command = "pnpm --filter @tuturai/web build"

[dev]
  command = "pnpm --filter @tuturai/web dev"
  framework = "#custom"
  targetPort = 3000
  port = 8888

[[headers]]
  for = "/*"

  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

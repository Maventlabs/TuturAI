[build]
  base = "."
  command = "pnpm --filter @tuturai/web build"
  publish = "apps/web/.next"
  functions = "apps/functions/netlify"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  # Functions runtime must match the build: firebase-admin@14 -> jwks-rsa -> jose@6
  # (ESM-only) requires Node >= 22.12. NODE_VERSION alone only covers the build.
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  NEXT_PUBLIC_FIREBASE_API_KEY = "AIzaSyAXOPWBW2kJaQEPtPCdga-mNi_14gHDdf8"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN = "gen-lang-client-0138449759.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID = "gen-lang-client-0138449759"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET = "gen-lang-client-0138449759.firebasestorage.app"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = "673117335596"
  NEXT_PUBLIC_FIREBASE_APP_ID = "1:673117335596:web:e97cbc44894d30d3f4e189"
  NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST = ""
  NEXT_PUBLIC_FIREBASE_FIRESTORE_EMULATOR_HOST = ""
  FIREBASE_ADMIN_PROJECT_ID = "gen-lang-client-0138449759"
  # Netlify secrets scanning greps the repo for the literal VALUE of every
  # environment variable, so any variable holding an ordinary word or boolean
  # produces mass false positives. `E2E_GOOGLE_AUTH_ROLE` is literally
  # "student"/"teacher", which appear in firestore.rules, every role guard and
  # every document, so the build fails on ~700 matches of public code.
  # These keys are non-secret identifiers, enums, booleans and URLs. Omitting
  # them changes no security posture.
  #
  # NEVER add real credentials here: AI_V1_API_KEY, AI_LOCAL_API_KEY,
  # FIREBASE_ADMIN_PRIVATE_KEY, FIREBASE_ADMIN_CLIENT_EMAIL,
  # GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_OAUTH_TOKEN_ENCRYPTION_KEY,
  # CLOUDINARY_API_SECRET, UPSTASH_REDIS_REST_TOKEN, or any E2E password.
  SECRETS_SCAN_OMIT_KEYS = "AI_STT_ROUTE,AI_TTS_ROUTE,AI_LLM_ROUTE,AI_STT_MODEL_ID,AI_TTS_MODEL_ID,AI_LLM_MODEL_ID,FIREBASE_ADMIN_PROJECT_ID,GOOGLE_OAUTH_REDIRECT_URI,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,AI_LOCAL_BASE_URL,AI_V1_BASE_URL,AI_PRONUNCIATION_ROUTE,AI_PRONUNCIATION_MODEL_ID,AI_PRONUNCIATION_PATH,NODE_VERSION,AWS_LAMBDA_JS_RUNTIME,E2E_BASE_URL,E2E_ALLOW_CUSTOM_NETLIFY_HOST,E2E_FIREBASE_PROJECT_ID,E2E_FIREBASE_ADMIN_PROJECT_ID,E2E_TEST_PREFIX,E2E_TEST_DATA_APPROVED,E2E_CLEANUP_AFTER_RUN,E2E_HEADLESS,E2E_GOOGLE_AUTH_ENABLED,E2E_GOOGLE_AUTH_ROLE,E2E_GOOGLE_AUTH_TEST_ACCOUNT_APPROVED,E2E_AI_ENABLED,E2E_DRIVE_ENABLED,E2E_DRIVE_ACCOUNT_APPROVED,E2E_OFFLINE_ENABLED,E2E_PRONUNCIATION_ENABLED,E2E_VOICE_ENABLED,E2E_EXPECTED_TEXT,E2E_AUDIO_FIXTURE_PATH,E2E_CLASSROOM_ID,E2E_FOREIGN_CLASSROOM_ID,E2E_REVOKED_JOIN_CLASSROOM_ID"

[context.production]
  command = "pnpm --filter @tuturai/web build"

[context.deploy-preview]
  command = "pnpm --filter @tuturai/web build"

[context.branch-deploy]
  command = "pnpm --filter @tuturai/web build"

[dev]
  command = "pnpm --filter @tuturai/web dev"
  framework = "#custom"
  targetPort = 3000
  port = 8888

[[headers]]
  for = "/*"

  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self' blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://accounts.google.com wss://*.firebaseio.com; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com"

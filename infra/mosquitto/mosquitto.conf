## Mosquitto 2.x broker configuration for local testing and demos.
##
## TLS listener on 8883 with username/password authentication and per-device ACLs
## through the dynamic-security plugin.
##
## The pilot broker and the developer laptop live on the same network, typically a
## phone hotspot. No port forwarding is used, so the broker listens on all
## interfaces but is only reachable from that local network.

# --- Listener -----------------------------------------------------------------
listener 8883
protocol mqtt

# A plain listener on 1883 is deliberately NOT enabled. Every device connection
# must be TLS: the MQTT payload carries telemetry and the device authenticates
# with a one-time secret.

# --- Authentication and ACLs ---------------------------------------------------
# dynamic-security is what enforces "a device may only touch its own topics".
# The device ACL rules are:
#   publish   tuturai/devices/{deviceId}/presence
#   publish   tuturai/devices/{deviceId}/telemetry
#   publish   tuturai/devices/{deviceId}/ack
#   subscribe tuturai/devices/{deviceId}/config
#   subscribe tuturai/devices/{deviceId}/cmd
# No wildcards are granted to devices. Only the bridge may publish to config and
# cmd.
plugin /usr/local/lib/mosquitto_dynamic_security.so

# The plugin database is created on first start and then managed through the
# bridge's admin API. It is gitignored.
plugin_opt_config_file /mosquitto/config/dynamic-security.json

# --- Persistence --------------------------------------------------------------
# Persistence lets a broker restart without losing retained presence messages.
persistence true
persistence_location /mosquitto/data/

# --- Logging ------------------------------------------------------------------
# No verbose logging: telemetry is every 60 s per device and the log volume would
# be meaningless noise during a classroom session.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true

# --- Connection limits --------------------------------------------------------
# The class-hour sizing is a few dozen devices; this ceiling exists to stop a
# misconfigured device from reconnecting in a tight loop.
max_connections 200
max_inflight_messages 20
max_queued_messages 200

# --- Keepalive ----------------------------------------------------------------
# The device publishes telemetry every 60 s; a 90 s keepalive catches a device
# that has gone away without waiting for a TCP timeout.
max_keepalive 120
# Mosquitto broker for local device testing.
#
#   docker compose up -d
#
# The CA and server certificate must exist before the broker will start. They are
# generated by ../certs/generate.sh and are gitignored.

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: tuturai-mosquitto
    restart: unless-stopped
    ports:
      # Reachable from the laptop network only. No port forwarding is configured.
      - "8883:8883"
      - "9001:9001"   # dynamic-security admin API, loopback use only
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./dynamic-security.json:/mosquitto/config/dynamic-security.json
      - ./certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    command: >
      sh -c "cp /certs/server.crt /certs/server.key /mosquitto/certs/ 2>/dev/null || true;
             mosquitto -c /mosquitto/config/mosquitto.conf"

volumes:
  mosquitto-data:
<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6df5">
    <meta name="color-scheme" content="light">
    <meta name="description" content="TuturAI sedang offline.">
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>TuturAI sedang offline</title>
    <link rel="preload" as="image" href="/brand/logo-icon.png">
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f5f7;
        --surface: #ffffff;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --primary: #2f6df5;
        --border: #d2d2d7;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--text);
      }
      main {
        width: min(100%, 480px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 32px;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: var(--primary);
        box-shadow: 0 10px 26px -14px rgba(47, 109, 245, .8);
      }
      .mark img { display: block; width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 0 0 12px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
      p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
      .queue {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 14px;
        color: var(--muted);
        background: var(--canvas);
      }
      .queue strong { color: var(--text); }
      button {
        margin-top: 20px;
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { filter: brightness(.94); }
      @media (prefers-reduced-motion: no-preference) {
        .mark { animation: bob 1.8s ease-in-out infinite; }
        @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><img src="/brand/logo-icon.png" alt="" width="72" height="72" decoding="async"></div>
      <h1>TuturAI sedang offline</h1>
      <p>Kamu sedang kehilangan koneksi. Latihan yang tersimpan di perangkat tetap aman dan akan disinkronkan otomatis setelah jaringan kembali.</p>
      <div class="queue"><strong>Jangan tutup tab</strong> selama masih ada antrean sinkronisasi.</div>
      <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
  </body>
</html>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f6df5">
    <title>TuturAI offline</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f5f5f7; color: #1d1d1f; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 520px); background: #fff; border: 1px solid #d2d2d7; border-radius: 18px; padding: 32px; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0; color: #6e6e73; line-height: 1.55; }
      strong { color: #1d1d1f; }
    </style>
  </head>
  <body>
    <main>
      <h1>TuturAI sedang offline</h1>
      <p>Perubahan yang sudah disimpan di perangkat akan disinkronkan saat koneksi kembali. <strong>Jangan tutup tab</strong> jika masih ada antrean sinkronisasi.</p>
    </main>
  </body>
</html>

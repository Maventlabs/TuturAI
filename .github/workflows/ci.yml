name: TuturAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Production build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDifYDt0iFQQfCHJ0l1TYBk7roITNitu9M"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "tuturai-cfa8c.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "tuturai-cfa8c"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "tuturai-cfa8c.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1092924309240"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1092924309240:web:7907251dc9ceedf173850d"
          FIREBASE_ADMIN_PROJECT_ID: "tuturai-cfa8c"
        run: pnpm build

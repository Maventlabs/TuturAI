name: TuturAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Production build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAXOPWBW2kJaQEPtPCdga-mNi_14gHDdf8"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "gen-lang-client-0138449759.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "gen-lang-client-0138449759"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "gen-lang-client-0138449759.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "673117335596"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:673117335596:web:e97cbc44894d30d3f4e189"
          FIREBASE_ADMIN_PROJECT_ID: "gen-lang-client-0138449759"
        run: pnpm build
